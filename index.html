<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document Intelligence</title>
    <meta
      name="description"
      content="Upload PDFs, CSVs, images, and recordings; store and parse every source, extract entities and relationships, and uncover the connections inside your evidence."
    />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)" />

    <!--
      Apply the stored theme before first paint so dark-mode users never see a
      white flash. Keep the storage key in sync with src/lib/theme.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("di-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Document Intelligence" />
    <meta property="og:title" content="Document Intelligence" />
    <meta
      property="og:description"
      content="Upload PDFs, CSVs, images, and recordings; store and parse every source, extract entities and relationships, and uncover the connections inside your evidence."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Document Intelligence" />
    <meta
      name="twitter:description"
      content="Upload PDFs, CSVs, images, and recordings; store and parse every source, extract entities and relationships, and uncover the connections inside your evidence."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
