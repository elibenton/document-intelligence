<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Haystack</title>
    <meta
      name="description"
      content="Anything in. Answers out. Upload PDFs, CSVs, images, and recordings — every source parsed, entities and relationships extracted, answers cited back to the page."
    />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://glorious-warbler-976.convex.site/" />

    <!-- Standalone (installed) window on iOS, which ignores the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Haystack" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)" />

    <!--
      Apply the stored theme before first paint so dark-mode users never see a
      white flash. Keep the storage key in sync with src/lib/theme.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("di-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:url" content="https://glorious-warbler-976.convex.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haystack" />
    <meta property="og:title" content="Haystack" />
    <meta
      property="og:description"
      content="Anything in. Answers out. Upload PDFs, CSVs, images, and recordings — every source parsed, entities and relationships extracted, answers cited back to the page."
    />
    <meta property="og:image" content="https://glorious-warbler-976.convex.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Haystack" />
    <meta
      name="twitter:description"
      content="Anything in. Answers out. Upload PDFs, CSVs, images, and recordings — every source parsed, entities and relationships extracted, answers cited back to the page."
    />
    <meta name="twitter:image" content="https://glorious-warbler-976.convex.site/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
