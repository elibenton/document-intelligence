<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 340px; margin: 0; padding: 14px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 16px; height: 16px; }
    .site { color: #888; font-size: 12px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    label { display: block; font-weight: 600; margin: 8px 0 3px; }
    input, textarea {
      width: 100%; box-sizing: border-box; padding: 6px 8px;
      border: 1px solid #ccc; border-radius: 6px; font: inherit;
    }
    textarea { resize: vertical; min-height: 44px; }
    button {
      width: 100%; margin-top: 12px; padding: 8px; border: 0; border-radius: 6px;
      background: light-dark(#000, #fff); color: light-dark(#fff, #000); font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    #status.error { color: #dc2626; white-space: pre-wrap; }
    #status.ok { color: #16a34a; }
    #status a { color: inherit; }
    .footer { margin-top: 10px; font-size: 11px; text-align: right; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <h1><img id="favicon" alt="" hidden /><span>Clip this page</span></h1>
  <div class="site" id="pageUrl"></div>

  <label for="title">Title</label>
  <input id="title" type="text" />

  <label for="tags">Tags <span style="font-weight:400;color:#888">(comma-separated)</span></label>
  <input id="tags" type="text" placeholder="research, finance" />

  <label for="notes">Notes</label>
  <textarea id="notes" placeholder="Why are you clipping this?"></textarea>

  <button id="clip">Clip &amp; Archive</button>
  <div id="status"></div>

  <div class="footer"><a href="#" id="openOptions">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
