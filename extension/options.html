<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Haystack Clipper — Settings</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      max-width: 560px; margin: 40px auto; padding: 0 20px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { font-size: 18px; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    .hint { font-weight: 400; color: #888; font-size: 12px; }
    input {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #ccc; border-radius: 6px; font: inherit;
    }
    button {
      margin-top: 20px; padding: 8px 20px; border: 0; border-radius: 6px;
      background: light-dark(#000, #fff); color: light-dark(#fff, #000); font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary {
      background: transparent; color: inherit; border: 1px solid #ccc; font-weight: 400;
      margin-left: 10px;
    }
    #status { margin-top: 20px; }
    #status.ok { color: #16a34a; }
    #status .detail { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Haystack Clipper</h1>
  <p class="hint">
    Connecting opens Haystack in a new tab. Sign in there if you aren't
    already; the extension is set up automatically — nothing to paste.
  </p>

  <label for="appUrl">Haystack URL
    <span class="hint">— only change this if you run the app somewhere else (e.g. http://localhost:5173 in development)</span>
  </label>
  <input id="appUrl" type="url" />

  <button id="connect">Sign in &amp; connect</button>
  <button id="disconnect" class="secondary" hidden>Disconnect</button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
